<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 Page Not Found - Alumni Professional Details Update Management System">
  <title>404 - Page Not Found | APIUMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="/libs/fontawesome/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 50%, #F0F0FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }
    .float-animation {
      animation: float404 6s ease-in-out infinite;
    }
    @keyframes float404 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    .bg-grid {
      background-image: radial-gradient(circle at 1px 1px, rgba(37, 99, 235, 0.06) 1px, transparent 0);
      background-size: 40px 40px;
    }
    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div style="position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;" class="bg-grid">
    <div class="glow-circle" style="width:400px;height:400px;background:#2563EB;top:-80px;left:-80px;"></div>
    <div class="glow-circle" style="width:350px;height:350px;background:#7C3AED;bottom:-60px;right:-60px;"></div>
    <div class="glow-circle" style="width:250px;height:250px;background:#10B981;bottom:30%;right:10%;"></div>

    <div style="text-align:center;padding:40px 24px;position:relative;z-index:1;max-width:520px;">
      <div class="float-animation">
        <div style="font-size:8rem;font-weight:800;line-height:1;margin-bottom:8px;background:linear-gradient(135deg,#2563EB,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">404</div>
      </div>

      <div style="font-size:4rem;color:var(--primary);margin-bottom:16px;opacity:0.6;">
        <i class="fas fa-compass"></i>
      </div>

      <h1 style="font-size:1.5rem;font-weight:700;color:#1E293B;margin:0 0 8px;">Page Not Found</h1>

      <p style="font-size:0.95rem;color:#64748B;max-width:400px;margin:0 auto 32px;line-height:1.6;">
        The page you are looking for does not exist or has been moved. Please check the URL or navigate back to the dashboard.
      </p>

      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;font-weight:600;font-size:0.9rem;text-decoration:none;box-shadow:0 4px 16px rgba(37,99,235,0.3);transition:all 0.3s ease;">
          <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="javascript:history.back()" style="display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;background:#fff;color:#1E293B;font-weight:500;font-size:0.9rem;text-decoration:none;border:1px solid #E2E8F0;transition:all 0.3s ease;">
          <i class="fas fa-arrow-left"></i> Go Back
        </a>
      </div>

      <div style="margin-top:48px;font-size:0.8rem;color:#94A3B8;">
        <p style="margin:0;">Need help? <a href="mailto:support@alumnims.edu" style="color:#2563EB;text-decoration:none;font-weight:500;">Contact Support</a></p>
      </div>
    </div>
  </div>
</body>
</html>
